<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联机小游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>联机小游戏平台</h1>

    <div class="card">
      <label>你的名字</label>
      <input id="nameInput" placeholder="输入名字" maxlength="20" />

      <div class="actions">
        <button id="createRoomBtn">创建房间</button>
      </div>

      <div class="join-row">
        <input id="roomInput" placeholder="输入房间号" maxlength="10" />
        <button id="joinRoomBtn">加入房间</button>
      </div>

      <p class="tip">把邀请链接发到 QQ，对方点开即可加入。</p >
      <p id="errorBox" class="error"></p >
    </div>

    <div id="roomSection" class="card hidden">
      <h2>房间信息</h2>
      <p>房间号：<span id="roomIdText"></span></p >
      <p>邀请链接：</p >
      <div class="invite-row">
        <input id="inviteLink" readonly />
        <button id="copyLinkBtn">复制</button>
      </div>

      <div class="player-list">
        <h3>玩家</h3>
        <ul id="playersList"></ul>
      </div>

      <div class="game-select">
        <h3>选择游戏</h3>
        <div class="game-buttons">
          <button data-game="tictactoe">井字棋</button>
          <button data-game="gomoku">五子棋</button>
          <button data-game="rps">猜拳</button>
        </div>
      </div>

      <div class="actions">
        <button id="restartBtn">重新开始</button>
      </div>
    </div>

    <div id="gameSection" class="card hidden">
      <h2 id="gameTitle">游戏区</h2>
      <p id="statusText"></p >
      <div id="gameArea"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
